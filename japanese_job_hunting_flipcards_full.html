<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日本就活日语翻卡学习库</title>
<style>
:root {
 --bg:#f4f5f7; --card:#fff; --ink:#111827; --muted:#6b7280;
 --accent:#2c9ac2; --accent2:#dff4fb; --line:#e5e7eb; --good:#16a34a; --bad:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Noto Sans JP",Arial,sans-serif;color:var(--ink)}
header{padding:28px 24px 16px;text-align:center}
h1{margin:0;font-size:clamp(28px,5vw,46px)} .sub{color:var(--muted);margin-top:8px}
.controls{max-width:1000px;margin:0 auto;padding:12px 20px;display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px}
.controls input,.controls select,.controls button{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font-size:14px}
.controls button{cursor:pointer} .controls button.primary{background:var(--accent);color:white;border-color:var(--accent)}
.wrap{max-width:1000px;margin:auto;padding:18px 20px 40px}
.progressRow{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:10px}
.progress{height:8px;background:#e7e9ed;border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress>div{height:100%;background:var(--accent);width:0}
.scene{perspective:1200px;min-height:440px}
.card{position:relative;width:100%;min-height:440px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border-radius:30px;box-shadow:0 14px 40px rgba(17,24,39,.09);display:flex;align-items:center;justify-content:center;padding:42px}
.back{transform:rotateY(180deg)}
.frontContent,.backContent{text-align:center;max-width:760px}
.badge{display:inline-block;background:var(--accent2);color:#16718f;border-radius:999px;padding:5px 10px;font-size:13px;margin-bottom:18px}
.term{font-size:clamp(36px,7vw,66px);font-weight:650;line-height:1.25}
.kana{font-size:clamp(20px,3vw,30px);color:#4b8196;margin-top:15px}
.tip{color:#9ca3af;margin-top:35px}
.meaning{font-size:clamp(28px,5vw,44px);font-weight:700;margin-bottom:24px}
.ex{font-size:clamp(20px,3vw,27px);line-height:1.55;margin-top:18px}
.exzh{font-size:17px;color:var(--muted);line-height:1.6;margin-top:8px}
.nav{display:grid;grid-template-columns:1fr auto auto auto 1fr;gap:10px;margin-top:18px;align-items:center}
.nav button{border:0;border-radius:14px;background:white;padding:13px 18px;font-size:16px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.04)}
.nav button.mark{font-size:22px;width:54px;height:50px;padding:0}
.nav button.bad{color:var(--bad)} .nav button.good{color:var(--good)}
.nav button.next{background:var(--accent);color:#fff}
.stats{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}
.listPanel{margin-top:28px;background:white;border-radius:18px;padding:18px;display:none}
.listPanel.open{display:block}
.listItem{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
.listItem:last-child{border-bottom:0}
.listItem b{font-size:16px} .listItem span{color:var(--muted);margin-left:10px}
@media(max-width:700px){
 .controls{grid-template-columns:1fr 1fr}
 .scene,.card{min-height:390px}
 .face{padding:28px 20px;border-radius:24px}
 .nav{grid-template-columns:1fr auto auto 1fr}
 .nav .spacer{display:none}
}
</style>
</head>
<body>
<header>
 <h1>日本就活日语翻卡学习库</h1>
 <div class="sub">单词・高频句・句型｜点卡片翻面｜支持分类、搜索、随机</div>
</header>

<div class="controls">
 <input id="search" placeholder="搜索：就活 / 面接 / 内定 / 中文意思">
 <select id="typeSel">
   <option value="all">全部类型</option>
   <option value="word">单词</option>
   <option value="sentence">句子</option>
   <option value="pattern">句型</option>
 </select>
 <select id="catSel"><option value="all">全部分类</option><option value="ES与面试">ES与面试</option><option value="IT・SIer">IT・SIer</option><option value="Marketing・化妆品">Marketing・化妆品</option><option value="Web测试">Web测试</option><option value="句型">句型</option><option value="基础就活">基础就活</option><option value="学校就职咨询">学校就职咨询</option><option value="岗位与公司">岗位与公司</option><option value="待遇与职场">待遇与职场</option><option value="申请与选考">申请与选考</option><option value="老师常说">老师常说</option><option value="能力与评价">能力与评价</option><option value="说明会与活动">说明会与活动</option><option value="说明会高频">说明会高频</option><option value="面试高频">面试高频</option><option value="高频动词">高频动词</option></select>
 <button id="shuffle" class="primary">随机顺序</button>
</div>

<div class="wrap">
 <div class="progressRow">
   <div id="countInfo"></div>
   <div id="filterInfo"></div>
 </div>
 <div class="progress"><div id="bar"></div></div>

 <div class="scene">
   <div class="card" id="card">
     <div class="face front">
       <div class="frontContent">
         <div class="badge" id="badgeF"></div>
         <div class="term" id="frontTerm"></div>
         <div class="kana" id="frontKana"></div>
         <div class="tip">点击卡片查看中文和例句</div>
       </div>
     </div>
     <div class="face back">
       <div class="backContent">
         <div class="badge" id="badgeB"></div>
         <div class="meaning" id="meaning"></div>
         <div class="ex" id="example"></div>
         <div class="exzh" id="exampleZh"></div>
         <div class="tip">再次点击翻回正面</div>
       </div>
     </div>
   </div>
 </div>

 <div class="nav">
   <button id="prev">← 上一张</button>
   <button id="miss" class="mark bad" title="不会">×</button>
   <button id="known" class="mark good" title="会">✓</button>
   <span class="spacer"></span>
   <button id="next" class="next">下一张 →</button>
 </div>
 <div class="stats" id="stats"></div>
</div>

ont": "～かもしれない", "kana": "", "back_title": "可能……", "example": "面接で聞かれるかもしれません。", "example_zh": "面试中可能会被问到。"}, {"type": "pattern", "category": "句型", "front": "～とは限らない", "kana": "", "back_title": "不一定……", "example": "説明会参加者が全員通るとは限りません。", "example_zh": "并不是参加说明会的人都能通过。"}, {"type": "pattern", "category": "句型", "front": "～場合がある", "kana": "", "back_title": "有……的情况", "example": "追加面接がある場合があります。", "example_zh": "有时会有追加面试。"}, {"type": "pattern", "category": "句型", "front": "～について", "kana": "", "back_title": "关于……", "example": "研究内容について説明してください。", "example_zh": "请说明一下研究内容。"}, {"type": "pattern", "category": "句型", "front": "～に関して", "kana": "", "back_title": "关于……（较正式）", "example": "勤務地に関して希望はありますか。", "example_zh": "关于工作地点有要求吗？"}, {"type": "pattern", "category": "句型", "front": "～につながる", "kana": "", "back_title": "连接到、有助于……", "example": "この経験は早期選考につながります。", "example_zh": "这段经历会连接到早期选考。"}, {"type": "pattern", "category": "句型", "front": "～ようにしてください", "kana": "", "back_title": "请尽量做到……", "example": "結論から話すようにしてください。", "example_zh": "请尽量先说结论。"}, {"type": "pattern", "category": "句型", "front": "～と思います", "kana": "", "back_title": "我认为……", "example": "この会社は合っていると思います。", "example_zh": "我觉得这家公司适合你。"}];
let filtered = [...ALL], idx=0, known=0, missed=0;
const $ = id => document.getElementById(id);
function normalize(s){return String(s||'').toLowerCase()}
function applyFilter(){
  const q=normalize($('search').value.trim());
  const type=$('typeSel').value, cat=$('catSel').value;
  filtered=ALL.filter(x=>{
    const hay=normalize([x.front,x.kana,x.back_title,x.example,x.example_zh,x.category].join(' '));
    return (!q||hay.includes(q)) && (type==='all'||x.type===type) && (cat==='all'||x.category===cat);
  });
  idx=0; render();
}
function render(){
  if(!filtered.length){
    $('frontTerm').textContent='没有匹配结果'; $('frontKana').textContent=''; $('meaning').textContent='请调整搜索或分类';
    $('example').textContent=''; $('exampleZh').textContent=''; $('badgeF').textContent=''; $('badgeB').textContent='';
    $('countInfo').textContent='0 / 0'; $('bar').style.width='0%'; return;
  }
  const x=filtered[idx];
  $('card').classList.remove('flipped');
  $('badgeF').textContent=x.category + ' · ' + (x.type==='word'?'单词':x.type==='sentence'?'句子':'句型');
  $('badgeB').textContent=$('badgeF').textContent;
  $('frontTerm').textContent=x.front;
  $('frontKana').textContent=x.kana||'';
  $('meaning').textContent=x.back_title;
  $('example').textContent=x.example||'';
  $('exampleZh').textContent=x.example_zh||'';
  $('countInfo').textContent=`${idx+1} / ${filtered.length}`;
  $('filterInfo').textContent=`总库：${ALL.length} 张`;
  $('bar').style.width=((idx+1)/filtered.length*100)+'%';
  $('stats').textContent=`已标记会：${known} ｜ 不会：${missed}`;
}
function next(){ if(!filtered.length)return; idx=(idx+1)%filtered.length; render(); }
function prev(){ if(!filtered.length)return; idx=(idx-1+filtered.length)%filtered.length; render(); }
$('card').onclick=()=> $('card').classList.toggle('flipped');
$('next').onclick=next; $('prev').onclick=prev;
$('known').onclick=()=>{known++; next()};
$('miss').onclick=()=>{missed++; next()};
$('shuffle').onclick=()=>{filtered.sort(()=>Math.random()-.5); idx=0; render()};
$('search').addEventListener('input',applyFilter);
$('typeSel').addEventListener('change',applyFilter);
$('catSel').addEventListener('change',applyFilter);
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight') next();
 if(e.key==='ArrowLeft') prev();
 if(e.key===' ' && document.activeElement.tagName!=='INPUT'){e.preventDefault(); $('card').classList.toggle('flipped')}
});
render();
</script>
